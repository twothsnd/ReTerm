[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reterm-core"
version = "0.1.0"
description = "Training components for ReTerm terminal agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  ".", "src", "sft", "rl", "rl/verl",
  "rl/external/Megatron-Bridge/src",
  "rl/external/Megatron-Bridge/3rdparty/Megatron-LM",
]
testpaths = ["tests"]
